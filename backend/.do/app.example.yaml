name: vige-backend
services:
  - name: api
    environment_slug: docker
    source_dir: /
    dockerfile_path: Dockerfile
    run_command: ./start.sh
    http_port: 8000
    health_check:
      http_path: /healthz
    instance_count: 1
    instance_size_slug: basic-xxs
    envs: &shared_envs
      - key: ENVIRONMENT
        value: production
      - key: APP_PORT
        value: "8000"
      - key: FORCE_HTTPS_REDIRECT
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: AUTH_DEBUG_RETURN_RESET_TOKEN
        value: "false"
      - key: CELERY_WORKER_CONCURRENCY
        value: "8"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_JWT_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_BASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        type: SECRET
      - key: TRUSTED_HOSTS
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_ALLOWED_EMAILS
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        type: SECRET

workers:
  - name: queue-worker
    environment_slug: docker
    source_dir: /
    dockerfile_path: Dockerfile
    run_command: ./worker.sh
    instance_count: 1
    instance_size_slug: basic-xxs
    envs: *shared_envs
